name: selfcheck

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plugin manifest and frontmatter are valid
        run: python3 skills/seo-playbook/scripts/selfcheck.py

      - name: Reusable code behaves as documented
        run: python3 skills/seo-playbook/scripts/selftest.py
